services:
  - type: web
    name: used-car-estimator-api
    runtime: python
    buildCommand: "pip install uv && uv pip install -r summative/API/requirements.txt"
    startCommand: "uvicorn summative.API.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOWED_ORIGINS
        value: "https://estimator.yourdomain.com,http://localhost:3000"
    healthCheckPath: /health
    disk:
      name: model-storage
      mountPath: /app/summative/linear_regression/models
      sizeGB: 1